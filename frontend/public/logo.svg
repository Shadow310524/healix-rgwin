<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circular rings/swooshes resembling the RG box logo -->
  <!-- Left grey arc -->
  <path d="M 32,15 A 38,38 0 0,0 32,85" fill="none" stroke="#8E8E93" stroke-width="9" stroke-linecap="round" />
  <!-- Right dark blue arc -->
  <path d="M 68,85 A 38,38 0 0,0 68,15" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round" />
  
  <!-- Central RG text -->
  <text x="50%" y="59%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="-1.5">
    <tspan fill="#E53935">R</tspan><tspan fill="#1565C0">G</tspan>
  </text>
</svg>
